<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>★ DIGITAL FUTURE ★ kawaii</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Rajdhani',sans-serif;
    background:linear-gradient(180deg,#d6f0ff 0%,#a9dcff 45%,#7cc4ff 100%);}

  .rainbow{position:fixed;inset:0;z-index:0;opacity:.24;pointer-events:none;mix-blend-mode:screen;
    background:repeating-linear-gradient(115deg,
      #ff8fb0 0 42px,#ffc48f 42px 84px,#fff08f 84px 126px,
      #a8ffbf 126px 168px,#8fe4ff 168px 210px,#bfa8ff 210px 252px);
    background-size:420px 420px;image-rendering:pixelated;animation:slide 9s linear infinite}
  @keyframes slide{to{background-position:420px 0}}

  .city{position:fixed;bottom:24%;left:0;right:0;height:26vh;z-index:0;pointer-events:none;opacity:.38;
    background:repeating-linear-gradient(90deg,#5a86e0 0 20px,#6f9bf0 20px 24px,transparent 24px 64px);
    mask-image:linear-gradient(transparent,#000 55%);
    -webkit-mask-image:linear-gradient(transparent,#000 55%)}
  .ground{position:fixed;bottom:0;left:0;right:0;height:22vh;z-index:1;
    background:linear-gradient(180deg,#ffe6a3,#ffcf6b);box-shadow:0 -3px 0 #fff}
  .ground::before{content:'';position:absolute;inset:0;opacity:.35;
    background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(210,140,40,.5) 46px 50px)}

  .stars{position:fixed;inset:0;z-index:2;pointer-events:none}
  .stars b{position:absolute;color:#fff;text-shadow:0 0 6px #fff;animation:tw 2.4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}

  /* corazoncitos flotando */
  .hearts{position:fixed;inset:0;z-index:5;pointer-events:none}
  .hearts i{position:absolute;bottom:-30px;color:#ff8fb0;font-style:normal;
    animation:rise linear infinite;opacity:.8}
  @keyframes rise{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}

  .hud{position:fixed;top:24px;left:0;right:0;z-index:6;text-align:center;pointer-events:none}
  .kana{font-family:'Press Start 2P';font-size:30px;color:#4a7fe0;letter-spacing:6px;
    text-shadow:3px 3px 0 #fff,6px 6px 0 rgba(255,143,176,.5)}
  .df{font-family:'Press Start 2P';font-size:17px;font-style:italic;color:#fff;
    -webkit-text-stroke:1.5px #4a7fe0;margin-top:10px;letter-spacing:2px;text-shadow:3px 3px 0 #ff8fb0}
  .kana2{font-family:'Press Start 2P';font-size:11px;color:#ff8fb0;letter-spacing:4px;
    margin-top:8px;text-shadow:1px 1px 0 #fff}
  @media(max-width:560px){.kana{font-size:18px}.df{font-size:12px}}

  .scene{position:fixed;inset:0;z-index:4;perspective:900px;
    display:flex;align-items:center;justify-content:center}
  /* chibi: chiquito + rebote bouncy */
  .char{transform-style:preserve-3d;transform:scale(.62);
    animation:bounce 2.4s ease-in-out infinite}
  @keyframes bounce{
    0%,100%{transform:scale(.62) translateY(18px) rotateY(-16deg)}
    50%{transform:scale(.66) translateY(-16px) rotateY(16deg)}}

  .part{position:absolute;transform-style:preserve-3d;left:50%;top:50%}
  .f{position:absolute;backface-visibility:visible}

  /* CABEZA grande y redonda (chibi) */
  .head{width:170px;height:150px;margin:-150px 0 0 -85px}
  .screen{width:170px;height:150px;border-radius:34px;
    background:radial-gradient(circle at 42% 34%,#ffffff,#eaf4ff);border:4px solid #eaf4ff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 12px #8fc0ff,inset 0 0 30px rgba(140,190,255,.5)}
  .tut{font-family:'Press Start 2P';font-size:30px;color:#333;letter-spacing:-1px;transform:translateY(2px)}
  .chip{position:absolute;top:14px;left:16px;color:#ff8fb0;font-size:14px}
  /* cachetitos */
  .blush{position:absolute;width:24px;height:14px;border-radius:50%;background:#ffb3c8;
    top:82px;opacity:.85;filter:blur(1px)}
  .blush.l{left:30px}.blush.r{right:30px}

  .antenna{width:6px;height:40px;margin:-192px 0 0 -3px;
    background:linear-gradient(#eaf4ff,#8fc0ff);border-radius:4px;transform:translateZ(1px)}
  .astar{margin:-220px 0 0 -16px;color:#ffd94d;font-size:32px;
    text-shadow:0 0 10px #ffb300;animation:pop 2.6s ease-in-out infinite;transform:translateZ(2px)}
  @keyframes pop{0%,100%{transform:translateZ(2px) scale(1) rotate(0)}
    50%{transform:translateZ(2px) scale(1.3) rotate(20deg)}}

  /* cuerpo chiquito redondito */
  .body{width:96px;height:84px;margin:6px 0 0 -48px}
  .body .f{width:96px;height:84px;border-radius:30px;
    background:linear-gradient(150deg,#a8d0ff,#5fa0ff);border:4px solid #eaf4ff;
    box-shadow:inset 0 0 16px rgba(255,255,255,.4)}
  .bstar{width:38px;height:38px;position:absolute;left:50%;top:22px;margin-left:-19px;
    color:#fff;font-size:38px;text-align:center;line-height:38px;transform:translateZ(50px)}

  /* bracitos redondos */
  .arm{width:34px;height:66px;margin:-40px 0 0 34px;transform:rotate(22deg)}
  .arm .f{width:34px;height:66px;border-radius:18px;
    background:linear-gradient(150deg,#ffc8a3,#ff9a5e);border:4px solid #ffe6d4}
  .hand{width:38px;height:38px;margin:-84px 0 0 40px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffdcc0,#ff9a5e);border:4px solid #ffe6d4;
    transform:translateZ(18px)}

  /* patitas cortas + tenis */
  .legL,.legR{width:32px;height:38px}
  .legL{margin:80px 0 0 -38px}.legR{margin:80px 0 0 6px}
  .legL .f,.legR .f{width:32px;height:38px;border-radius:14px;
    background:linear-gradient(150deg,#a8d0ff,#5fa0ff);border:4px solid #eaf4ff}
  .shoeL{margin:112px 0 0 -44px}.shoeR{margin:112px 0 0 0}
  .shoeL .f,.shoeR .f{width:46px;height:30px;border-radius:16px;
    background:linear-gradient(150deg,#ffffff,#eaf2ff);border:4px solid #ff8fb0}

  .shadow{position:fixed;z-index:3;left:50%;bottom:17vh;width:150px;height:30px;margin-left:-75px;
    background:radial-gradient(ellipse,rgba(40,70,150,.3),transparent 70%);
    animation:sh 2.4s ease-in-out infinite}
  @keyframes sh{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(.72);opacity:.3}}

  .esrb{position:fixed;left:14px;bottom:14px;z-index:7;background:#fff;border:2px solid #4a7fe0;
    border-radius:8px;padding:5px 8px;font-family:'Press Start 2P';font-size:8px;color:#4a7fe0;
    line-height:1.4;text-align:center;box-shadow:0 3px 0 rgba(74,127,224,.3)}
  .esrb b{font-size:16px;display:block}
</style>
</head>
<body>
  <div class="rainbow"></div>
  <div class="city"></div>
  <div class="ground"></div>
  <div class="stars" id="stars"></div>
  <div class="hearts" id="hearts"></div>

  <div class="hud">
    <div class="kana">スターライフ</div>
    <div class="df">DIGITAL FUTURE</div>
    <div class="kana2">デジタル フューチャー</div>
  </div>

  <div class="shadow"></div>

  <div class="scene">
    <div class="char">
      <div class="part astar">★</div>
      <div class="part antenna"></div>
      <div class="part head" id="head"></div>
      <div class="part body" id="body"></div>
      <div class="bstar">★</div>
      <div class="part arm" id="arm"></div>
      <div class="part hand"></div>
      <div class="part legL" id="legL"></div>
      <div class="part legR" id="legR"></div>
      <div class="part shoeL" id="shoeL"></div>
      <div class="part shoeR" id="shoeR"></div>
    </div>
  </div>

  <div class="esrb"><b>E</b>STAR<br>LIFE</div>

<script>
const sc=document.getElementById('stars');
for(let i=0;i<40;i++){const b=document.createElement('b');
  b.textContent='✦';b.style.left=Math.random()*100+'%';b.style.top=Math.random()*70+'%';
  b.style.fontSize=(8+Math.random()*15)+'px';b.style.animationDelay=(Math.random()*2.4)+'s';sc.appendChild(b);}

/* corazoncitos */
const hc=document.getElementById('hearts');
for(let i=0;i<12;i++){const h=document.createElement('i');
  h.textContent=Math.random()<.5?'♥':'✿';h.style.left=Math.random()*100+'%';
  h.style.fontSize=(12+Math.random()*16)+'px';
  h.style.animationDuration=(6+Math.random()*6)+'s';
  h.style.animationDelay=(Math.random()*6)+'s';
  h.style.color=['#ff8fb0','#ffc48f','#bfa8ff','#8fe4ff'][i%4];hc.appendChild(h);}

/* caja 3D de 4 caras */
function box(el,w,h,d){const hd=d/2;
  const mk=(t,f,cw,ch,lx)=>{const e=document.createElement('div');e.className='f';
    if(cw){e.style.width=cw+'px';e.style.height=ch+'px';e.style.left=lx+'px';}
    e.style.transform=t;if(f)e.style.filter=f;return e;};
  el.append(
    mk('translateZ('+hd+'px)'),
    mk('rotateY(180deg) translateZ('+hd+'px)','brightness(.82)'),
    mk('rotateY(90deg) translateZ('+(w/2)+'px)','brightness(.9)',d,h,(w/2-d/2)),
    mk('rotateY(-90deg) translateZ('+(w/2)+'px)','brightness(.9)',d,h,(w/2-d/2)));
}

/* cabeza con pantalla + cachetes */
const head=document.getElementById('head');
const hf=document.createElement('div');hf.className='f';hf.style.transform='translateZ(30px)';
hf.innerHTML='<div class="screen"><span class="chip">★</span><span class="blush l"></span><span class="tut">t_t</span><span class="blush r"></span></div>';
head.appendChild(hf);
box(head,170,150,60);

box(document.getElementById('body'),96,84,50);
box(document.getElementById('arm'),34,66,30);
box(document.getElementById('legL'),32,38,28);
box(document.getElementById('legR'),32,38,28);
box(document.getElementById('shoeL'),46,30,38);
box(document.getElementById('shoeR'),46,30,38);
</script>
</body>
</html>
