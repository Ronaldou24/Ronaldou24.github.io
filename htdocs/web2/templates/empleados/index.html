{% include 'header.html' %}

        <h1>Página principal de empleados</h1>
        <h2><a href="/create">Agregar Pibellero</a></h2>
        <table class="table table-light">
            <thead class="thead-light">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Foto</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for empleado in empleados %}
                <tr>
                    <td>{{ empleado[0] }}</td>
                    <td>{{ empleado[1] }}</td>
                    <td>{{ empleado[2] }}</td>
                    <td>{{ empleado[3] }}</td>
                    <td> Editar | 
                        <a href="/update/{{ empleado[0] }}"> Editar </a> |
                        <a href="/destroy/{{ empleado[0] }}"> Borrar </a> </td>
                </tr>                
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
