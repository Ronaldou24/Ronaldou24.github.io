<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Galería - HospiCELL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 20px;
        }
        h1 {
            text-align: center;
            color: #202020;
            margin-bottom: 30px;
        }
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px; /* espacio entre galería y botón */
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }
        .gallery-grid img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .gallery-grid img:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        /* Responsive height for larger images in wider screens */
        @media(min-width: 768px) {
            .gallery-grid img {
                height: 150px;
            }
        }
        @media(min-width: 1024px) {
            .gallery-grid img {
                height: 180px;
            }
        }
        /* Contenedor para el botón alineado a la derecha */
        .button-container {
            display: flex;
            justify-content: flex-end;
        }
        button {
            background-color: #29840e;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s ease;
            font-size: 1rem;
        }
        button:hover {
            background-color: #239b1a;
        }
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>
