<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Personal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #444;
            padding: 10px 0;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }
        section {
            padding: 20px;
            margin: 20px;
        }
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Tu Nombre</h1>
        <p>¡Bienvenido a mi página personal!</p>
    </header>
    <nav>
        <a href="#biografia">Biografía</a>
        <a href="#intereses">Intereses</a>
        <a href="#proyectos">Proyectos</a>
        <a href="#contacto">Contacto</a>
    </nav>
    <section id="biografia">
        <h2>Biografía</h2>
        <p>Escribe aquí tu biografía.</p>
    </section>
    <section id="intereses">
        <h2>Intereses</h2>
        <p>Escribe aquí tus intereses.</p>
    </section>
    <section id="proyectos">
        <h2>Proyectos</h2>
        <p>Escribe aquí tus proyectos.</p>
    </section>
    <section id="contacto">
        <h2>Contacto</h2>
        <p>Escribe aquí cómo pueden contactarte.</p>
    </section>
    <footer>
        <p>Derechos de autor &copy; 2024 - Tu Nombre</p>
    </footer>
</body>
</html>
