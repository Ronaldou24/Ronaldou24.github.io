<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
#chartContainer {
  width: 50%;
  height: 370px;
}
    </style>
</head>
<body>
    <!-- En esta ocasión si vamos a mostrar desde el inicio el "producto final" -->
<div id="chartContainer">
</div>
<!-- ¿Y esto de abajo qué era? -->
<script src="https://canvasjs.com/assets/script/canvasjs.min.js"></script>
<script>
// ¿Qué es chart? Es un ...
// ¿y qué es .Chart ?
// ¿y qué hay adentro de .Chart()?
var chart = new CanvasJS.Chart("chartContainer", {
	animationEnabled: true, // ¿Qué pasa si lo cambias a false?
	exportEnabled: true, // ¿Qué pasa si lo cambias a false?
	theme: "light1", // "light1", "light2", "dark1", "dark2"
	
  title:{
		text: "Venta de frutas este mes" //Intenta cambiarlo
	},
  
  axisY: {
      includeZero: true,  //Intenta cambiando a false
      title: "Cantidad de frutas" //Intenta cambiarlo
    },
  
  axisX: {
      title: "Frutas", //Intenta cambiarlo
      labelAngle: -30 //Intenta cambiar a cero
    },
	
  data: [{
		type: "column", //intenta cambier el type a bar, line, area, pie, doughnut, stepLine etc
		//indexLabel: "{y}", //Checa que pasa quitando el comentario o agregando "${y}"
		indexLabelFontColor: "gray", //Intenta cambiar
    indexLabelFontSize: 16, //Intenta cambiar
		indexLabelPlacement: "outside", //Intenta cambiando a inside o auto
		//¿Qué es dataPoints? ¿Y qué contiene?
    dataPoints: [
			{ label: "manzanas", y: 71 }, // Intenta cambiando valores
			{ label: "peras", y: 92, indexLabel: "\u2605 Mayor" }, //Intenta cambiando a \u2506
			{ label: "duraznos", y: 68 },
			{ label: "naranjas", y: 36 },
			{ label: "sandías", y: 49 },
			{ label: "piñas", y: 21, indexLabel: "\u2691 Menor" }
		]
	}]
});

// ¿Que era chart? , ¿De qué tipo? , ¿Qué es render()?
chart.render();

</script>
</body>
</html>
