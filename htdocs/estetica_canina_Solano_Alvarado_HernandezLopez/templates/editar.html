<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cita</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; }
        button:hover { background-color: #0056b3; }
        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #545b62; }
        .form-section { background-color: #f8f9fa; padding: 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Editar Cita</h1>
        
        <div class="form-section">
            <form action="{{ url_for('editar') }}" method="POST">
                <input type="hidden" name="folio" value="{{ cita[0] }}">
                
                <div class="form-group">
                    <label for="nombre">Nombre de la mascota:</label>
                    <input type="text" id="mascota" name="mascota" value="{{ cita[1] }}" required>
                </div>
                
                <div class="form-group">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" name="fecha" value="{{ cita[2] }}" required>
                </div>
                
                <div class="form-group">
                    <label for="hora">Hora:</label>
                    <input type="time" id="hora" name="hora" value="{{ cita[3] }}" required>
                </div>
                
               
                <div class="form-group">
                    <label for="servicio">Servicio:</label>
                    <input type="text" id="servicio" name="servicio" value="{{ cita[4] }}" required>
                </div>

                 <div class="form-group">
                    <label for="servicio">Tamaño:</label>
                    <input type="text" id="tamano" name="tamano" value="{{ cita[5] }}" required>
                </div>

                
                <div class="form-group">
                    <label for="costo">Costo:</label>
                    <input type="number" id="costo" name="costo" step="0.01" value="{{ cita[6] }}" required>
                </div>
                
                <button type="submit">Guardar Cambios</button>
                <a href="{{ url_for('index') }}">
                    <button type="button" class="btn-secondary">Cancelar</button>
                </a>
            </form>
        </div>
    </div>
</body>
</html>
