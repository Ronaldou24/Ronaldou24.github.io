<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Estética Canina</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <h1>Estética Canina</h1>
        <p>¡Dale a tu mascota el mejor cuidado!</p>
    </header>

    <section class="servicios">
        <h2>Servicios y Precios</h2>
        <table class="tabla-servicios">
            <thead>
                <tr>
                    <th>Servicio</th>
                    <th>Pequeño</th>
                    <th>Mediano</th>
                    <th>Grande</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Corte de Pelo ✂️</td>
                    <td>$100</td>
                    <td>$120</td>
                    <td>$150</td>
                </tr>
                <tr>
                    <td>Baño 🛁</td>
                    <td>$80</td>
                    <td>$100</td>
                    <td>$130</td>
                </tr>
                <tr>
                    <td>Corte y Baño 💖</td>
                    <td>$160</td>
                    <td>$200</td>
                    <td>$260</td>
                </tr>
            </tbody>
        </table>
    </section>

    <div class="acciones">
        <a href="funciones/agendar.html"><button>Agendar Servicio</button></a>
        <a href="funciones/cancelar.html"><button>Cancelación de Servicios</button></a>
        <a href="funciones/cambio_horario.html"><button>Cambio de Horario</button></a>

    </div>

    <section class="ver-citas">
        <h2>¿Quieres consultar tus citas?</h2>
        <a href="funciones/ver_citas.html">
            <button class="ver-citas-btn">Ver Citas</button>
        </a>
    </section>
</body>
</html>
