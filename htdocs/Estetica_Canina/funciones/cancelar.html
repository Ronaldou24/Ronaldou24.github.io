<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Cancelar Servicio - Estética Canina</title>
    <link rel="stylesheet" href="../styles.css" />
</head>
<body>
    <header>
        <h1>Cancelar Servicio</h1>
        <a href="index.html" class="volver">← Volver al menú</a>
    </header>
    <main>
        <section class="form-section">
            <h2>Cancela tu cita</h2>
            <form>
                <label for="folio">Folio de la Reserva</label>
                <input type="text" id="folio" name="folio" placeholder="Ej. 001" required />

                <label for="motivo">Motivo de Cancelación</label>
                <textarea id="motivo" name="motivo" rows="4" placeholder="Escribe el motivo..." required></textarea>

                <button type="submit" class="cancelar">Cancelar Servicio</button>
            </form>
        </section>
    </main>
</body>
</html>
