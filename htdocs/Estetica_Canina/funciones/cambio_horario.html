<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Cambiar Horario - Estética Canina</title>
    <link rel="stylesheet" href="../styles.css" />
</head>
<body>
    <header>
        <h1>Cambiar Horario</h1>
        <a href="index.html" class="volver">← Volver al menú</a>
    </header>
    <main>
        <section class="form-section">
            <h2>Solicita un cambio de horario</h2>
            <form>
                <label for="folio">Folio de la Reserva</label>
                <input type="text" id="folio" name="folio" placeholder="Ej. 001" required />

                <label for="nueva_fecha">Nueva Fecha</label>
                <input type="date" id="nueva_fecha" name="nueva_fecha" required />

                <label for="nueva_hora">Nueva Hora</label>
                <input type="time" id="nueva_hora" name="nueva_hora" required />

                <button type="submit" class="cambiar">Cambiar Horario</button>
            </form>
        </section>
    </main>
</body>
</html>
